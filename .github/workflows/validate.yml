name: Validate Sales Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate notebook JSON
        run: python - <<'PY'
          import json
          from pathlib import Path

          notebook = Path("notebooks/sales_data_analysis.ipynb")
          with notebook.open(encoding="utf-8") as file:
              data = json.load(file)

          assert data.get("nbformat", 0) >= 4
          assert isinstance(data.get("cells"), list)
          print(f"Validated {notebook}: {len(data['cells'])} cells")
          PY

      - name: Validate requirements file
        run: python - <<'PY'
          from pathlib import Path

          lines = [line.strip() for line in Path("requirements.txt").read_text().splitlines()]
          dependencies = [line for line in lines if line and not line.startswith("#")]
          assert dependencies, "requirements.txt must contain at least one dependency"
          print(f"Validated requirements.txt: {len(dependencies)} dependencies")
          PY
